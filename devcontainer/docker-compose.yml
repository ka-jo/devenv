# The default image's own service definition only. Everything that makes it a
# devenv agent container — proxy_net, proxy env, the Claude config and ~/devenv
# mounts, the worktree and git pins, container_name — is generated per worktree
# into override.json by _container_write_override (lib/container.sh), so it
# applies the same way to any config.
services:
  devcontainer:
    build:
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - pnpm-store:/home/ka-jo/.pnpm-store
      - zsh-history:/home/ka-jo/commandhistory
    environment:
      HISTFILE: /home/ka-jo/commandhistory/.zsh_history
      # Pin the pnpm store to the shared volume mount point regardless of
      # which user the container process runs as. (see: https://github.com/orgs/pnpm/discussions/9460)
      pnpm_config_store_dir: /home/ka-jo/.pnpm-store

volumes:
  pnpm-store:
    external: true
    name: shared-pnpm-store
  zsh-history:
    external: true
    name: ka-jo-zsh-history
